# Publishes the BASE images (no 1C binaries inside — debian packages only,
# hence redistributable) to Docker Hub:
#   1c-base:latest    — arm64 only (native 8.3/8.5 servers)
#   lic1c-base:latest — MULTI-ARCH arm64+amd64 (license stands: the working
#                       one consumes the amd64 variant via --platform, hence
#                       no -amd64 tag suffix — the manifest resolves it)
# Tags: latest (rolling, referenced by FROM in the version Dockerfiles) and
# 1 (a rollback anchor). Version images (pg1c, server1c, lic1c*) embed 1C
# distributions and are NEVER published.
# Triggers: Dockerfile.base / this workflow changed on main, or manual.
# Requires repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (hub.docker.com
# -> Account Settings -> Personal access tokens, read/write scope).
# Note: a force-push with rewritten history may dodge the paths filter —
# trigger manually after history rewrites.
name: publish-base-images

"on":
  push:
    branches: [main]
    paths:
      - src/Dockerfile.base
      - .github/workflows/publish-base-images.yml
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 builds on the amd64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push 1c-base (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Dockerfile.base
          target: base
          platforms: linux/arm64
          push: true
          build-args: GIT_REV=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/1c-base:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/1c-base:1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push lic1c-base (multi-arch arm64+amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Dockerfile.base
          target: lic-base
          platforms: linux/arm64,linux/amd64
          push: true
          build-args: GIT_REV=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lic1c-base:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/lic1c-base:1
          cache-from: type=gha
          cache-to: type=gha,mode=max
