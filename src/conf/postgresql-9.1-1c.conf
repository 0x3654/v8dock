# PostgreSQL 9.1.9-1.1C — tuning for 1C:Enterprise 8.2 (the rev82 playground).
# Warning: this is 9.1 syntax — do not copy into newer majors (checkpoint_segments
# was removed in 9.5+, fsync settings differ; the modern tuning is postgresql-1c.conf).

listen_addresses = '*'

# --- the mandatory trio of the 8.2 era ---
# Without it infobase creation fails with "syntax error at or near SECOND"
# and backslash-containing strings misbehave; verified on 9.1.9-1.1C +
# 8.2.19 (era forum wisdom).
backslash_quote = on
escape_string_warning = off
standard_conforming_strings = off

# --- classic 1C recommendations of that time ---
synchronous_commit = off        # write speed; acceptable for a playground
max_connections = 100
shared_buffers = 128MB
temp_buffers = 32MB
work_mem = 16MB
maintenance_work_mem = 128MB
effective_cache_size = 512MB

# --- era wal/checkpoint (in 9.1 GUCs) ---
wal_buffers = 8MB
checkpoint_segments = 16
checkpoint_completion_target = 0.9
