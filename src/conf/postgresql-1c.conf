# ============================================================================
# PostgreSQL 18.4-1.1C settings for 1C:Enterprise
# Source: Postgres Pro Standard, Appendix K
# "Configuring Postgres Pro for 1C solutions" (postgrespro.ru/docs/postgrespro/current/config-one-c)
# Included from $PGDATA/postgresql.conf (see entrypoints/docker-entrypoint.sh).
#
# Memory values are sized for a 128 GB RAM host (dev stand).
# Baked into the image (COPY in the Dockerfile); not edited live:
#   docker compose build pg1c && docker compose up -d pg1c
# ============================================================================

# --- network -----------------------------------------------------------------
listen_addresses = '*'
port = 5432

# --- connections and memory ---------------------------------------------------
max_connections = 500              # 1C opens many connections (recommended 500-1000)
shared_buffers = 2GB               # ~RAM/4; enough for a dev stand
# temp_buffers: 32-256MB, lower with many connections (1C transactions use
# temp tables heavily; the buffer grows lazily, as needed)
temp_buffers = 128MB
work_mem = 64MB                    # RAM/32-64; watch it at 100+ active sessions
maintenance_work_mem = 1GB         # 256MB-4GB: VACUUM/CREATE INDEX (1C reindex)
effective_cache_size = 8GB         # OS cache estimate for the planner
max_files_per_process = 10000

# --- locks / security (1C specifics: many temp tables) ------------------------
max_locks_per_transaction = 256
row_security = off

# --- 1C compatibility (mandatory) ----------------------------------------------
standard_conforming_strings = off
escape_string_warning = off

# --- planner --------------------------------------------------------------------
random_page_cost = 1.1             # SSD
effective_io_concurrency = 200     # SSD
max_parallel_workers_per_gather = 0  # 1C does not use parallel plans
jit = off
from_collapse_limit = 20
join_collapse_limit = 20
geqo = on
geqo_threshold = 12

# --- background writer -----------------------------------------------------------
bgwriter_delay = 20ms
bgwriter_lru_multiplier = 4.0
bgwriter_lru_maxpages = 400

# --- WAL / commit durability ------------------------------------------------------
synchronous_commit = off           # safe: only the last ms of transactions can be lost
checkpoint_timeout = 15min
min_wal_size = 512MB
max_wal_size = 2GB

# --- autovacuum (critical for 1C: huge tables like _InfRegRecord etc.) ------------
autovacuum = on
autovacuum_naptime = 20s
autovacuum_max_workers = 4

# --- log (for hunting slow 1C operations) -------------------------------------------
log_min_duration_statement = 1000  # log queries slower than 1 s
log_line_prefix = '%t [%p] user=%u,db=%d,app=%a,client=%h '
log_connections = off
log_disconnections = off
